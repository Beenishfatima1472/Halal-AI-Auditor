<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>MACI Architecture of Trust</title>
  <desc>Diagram showing how the MACI compliance layer sits between a client's existing AI stack and their end users, acting as a non-invasive shield without modifying the underlying AI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── LAYER 1: Client AI Stack ── -->
  <g class="c-gray">
    <rect x="40" y="30" width="600" height="80" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Client's existing AI stack</text>
    <text class="ts" x="340" y="82" text-anchor="middle" dominant-baseline="central">GPT-4 · Gemini · Claude · Custom LLM — unchanged, unmodified</text>
  </g>

  <!-- arrow down -->
  <line x1="340" y1="110" x2="340" y2="148" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <text class="ts" x="360" y="133" dominant-baseline="central">AI output</text>

  <!-- ── LAYER 2: MACI Compliance Layer ── -->
  <!-- Outer shell -->
  <g class="c-teal">
    <rect x="40" y="150" width="600" height="230" rx="14" stroke-width="0.5"/>
    <text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">🛡 MACI compliance layer</text>
    <text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">Non-invasive · Output-layer only · No changes to your model</text>
  </g>

  <!-- Inner module: Fake-Fatwa Shield -->
  <g class="c-purple">
    <rect x="60" y="210" width="168" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="144" y="237" text-anchor="middle" dominant-baseline="central">Fake-Fatwa Shield</text>
    <text class="ts" x="144" y="258" text-anchor="middle" dominant-baseline="central">Hallucinated rulings</text>
    <text class="ts" x="144" y="272" text-anchor="middle" dominant-baseline="central">Fabricated hadith</text>
  </g>

  <!-- Inner module: Financial Ethics Engine -->
  <g class="c-amber">
    <rect x="248" y="210" width="184" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="237" text-anchor="middle" dominant-baseline="central">Financial ethics engine</text>
    <text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">Riba · Gharar · Maysir</text>
    <text class="ts" x="340" y="272" text-anchor="middle" dominant-baseline="central">Deceptive pricing</text>
  </g>

  <!-- Inner module: Harm + Cultural -->
  <g class="c-coral">
    <rect x="452" y="210" width="168" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="536" y="237" text-anchor="middle" dominant-baseline="central">Harm + cultural layer</text>
    <text class="ts" x="536" y="258" text-anchor="middle" dominant-baseline="central">Life · Intellect</text>
    <text class="ts" x="536" y="272" text-anchor="middle" dominant-baseline="central">Lineage · Social norms</text>
  </g>

  <!-- Score bar -->
  <g class="c-gray">
    <rect x="60" y="298" width="560" height="68" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="323" text-anchor="middle" dominant-baseline="central">MACI score  0 – 50 pts</text>
    <text class="ts" x="340" y="345" text-anchor="middle" dominant-baseline="central">Certified ≥40 · Needs work 30–39 · Not certified &lt;30</text>
    <text class="ts" x="340" y="360" text-anchor="middle" dominant-baseline="central">Full audit report generated per run</text>
  </g>

  <!-- arrow down -->
  <line x1="340" y1="382" x2="340" y2="420" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <text class="ts" x="360" y="405" dominant-baseline="central">Report + score</text>

  <!-- ── LAYER 3: Deliverable ── -->
  <g class="c-blue">
    <rect x="40" y="422" width="600" height="70" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="450" text-anchor="middle" dominant-baseline="central">Audit report + certification</text>
    <text class="ts" x="340" y="472" text-anchor="middle" dominant-baseline="central">Score · Tier · Per-pillar findings · Remediation roadmap</text>
  </g>

  <!-- Side label: "Your stack stays intact" -->
  <text class="ts" x="36" y="75" text-anchor="end" transform="rotate(-90,36,75)"/>

  <!-- Bracket annotation on right -->
  <line x1="648" y1="150" x2="648" y2="380" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="660" y="265" text-anchor="start" dominant-baseline="central" transform="rotate(90,660,265)">MACI layer only</text>

  <!-- Footer note -->
  <text class="ts" x="340" y="520" text-anchor="middle" dominant-baseline="central">maqasidai.org · syedabeenishf.14@gmail.com</text>
  <text class="ts" x="340" y="538" text-anchor="middle" dominant-baseline="central">Your AI is never touched. MACI reads outputs. That's it.</text>
</svg>
